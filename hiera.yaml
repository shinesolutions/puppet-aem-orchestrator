---
version: 5

defaults:
  datadir: data
  data_hash: yaml_data

hierarchy:
  - name: OS family, name and major release
    path: "%{facts.os.family}/%{facts.os.name}-%{facts.os.release.major}.yaml"

  - name: OS family and name
    path: "%{facts.os.family}/%{facts.os.name}.yaml"

  - name: OS family
    path: "%{facts.os.family}.yaml"

  - name: Common
    path: common.yaml
