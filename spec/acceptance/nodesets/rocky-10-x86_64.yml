---
HOSTS:
  rocky-10-x86_64:
    roles:
      - default
    platform: el-10-x86_64
    image: rockylinux/rockylinux:10
    hypervisor: docker
    # Keep the built image so these layers are cached between runs. The agent and
    # prerequisites are baked in, so the installs in spec_helper_acceptance.rb are no-ops.
    docker_preserve_image: true
    docker_image_commands:
      - dnf install -y https://yum.voxpupuli.org/openvox9-release-el-10.noarch.rpm
      - dnf install -y openvox-agent libxcrypt-compat python3-pip java-21-openjdk-headless
    docker_cmd: '["/sbin/init"]'
    image_outer_ports:
      - 22
CONFIG:
  type: aio
