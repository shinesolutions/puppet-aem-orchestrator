---
HOSTS:
  amazon-2023-aarch64:
    roles:
      - default
    # Must match the image's OS: beaker uses it to pick the OpenVox repo, and
    # el-10 packages need GLIBC_2.38 while Amazon Linux 2023 ships glibc 2.34
    platform: amazon-2023-aarch64
    image: amazonlinux:2023
    hypervisor: docker
    # Keep the built image so these layers are cached between runs. The agent and
    # prerequisites are baked in, so the installs in spec_helper_acceptance.rb are no-ops.
    docker_preserve_image: true
    docker_image_commands:
      # amazonlinux:2023 ships without systemd, so /sbin/init has to be installed
      - dnf install -y systemd
      - dnf install -y https://yum.voxpupuli.org/openvox9-release-amazon-2023.noarch.rpm
      - dnf install -y openvox-agent libxcrypt-compat python3-pip java-21-amazon-corretto-headless
    docker_cmd: '["/sbin/init"]'
    image_outer_ports:
      - 22
CONFIG:
  type: aio
